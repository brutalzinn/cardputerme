; PlatformIO project for the M5Stack Cardputer ADV (Advance).
; The Cardputer ADV uses a StampS3A module (ESP32-S3FN8, 8 MB flash).
; The M5Cardputer library auto-detects Cardputer vs Cardputer-ADV at runtime
; via M5Unified, so the firmware source is identical to the original Cardputer.
;
; Build & upload:  pio run -t upload      Serial monitor:  pio device monitor

[env:cardputer-adv]
platform = espressif32
board = esp32-s3-devkitc-1        ; generic ESP32-S3; lib handles board specifics
framework = arduino
monitor_speed = 115200

board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv

; Inject firmware/.env (WiFi, server IP) as -DENV_* build flags at build time.
extra_scripts = pre:load_env.py

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1   ; expose USB serial on the StampS3A
    -DARDUINO_USB_MODE=1

lib_deps =
    m5stack/M5Cardputer
    bblanchon/ArduinoJson @ ^7
    links2004/WebSockets @ ^2.6.1
