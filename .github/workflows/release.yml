name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (must already be pushed, e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod

      - name: Cross-compile and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release-publish VERSION=${{ inputs.tag }}
