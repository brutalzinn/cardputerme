name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and publish (e.g. v0.1.0) — only needed to re-run a release"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platforms: darwin/arm64
            name: macos-arm64
          - runner: macos-15-intel
            platforms: darwin/amd64
            name: macos-intel
          - runner: ubuntu-latest
            platforms: linux/amd64 linux/arm64
            name: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout ${{ env.TAG }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod

      - name: Test on this platform
        run: make test

      - name: Build ${{ matrix.platforms }}
        run: make release PLATFORMS="${{ matrix.platforms }}"

      - name: Upload the binaries
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ env.TAG }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Collect every platform's binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Checksum and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release-upload VERSION=${{ env.TAG }}
